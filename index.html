<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Cardfile · Multilingual flashcards</title>

  <style>
    /* ------------------------------------------------------------------
       Design tokens
       Ink-blue on cool paper, styled after an index-card file: a red top
       rule and faint blue ruling on the review card, nowhere else.
       ------------------------------------------------------------------ */
    :root {
      --bg: #EDF0F5;
      --surface: #FFFFFF;
      --surface-2: #F4F6FA;
      --ink: #17233B;
      --ink-soft: #56617A;
      --line: #D3DAE6;

      --accent: #2F4FD8;
      --accent-strong: #233CB0;
      --accent-tint: #E4E9FC;
      --on-accent: #FFFFFF;

      --again: #B93A32;  --again-tint: #FBE9E7;
      --hard: #8F5A00;   --hard-tint: #FDF1D8;
      --good: #1B7350;   --good-tint: #E0F3EA;
      --easy: #2F4FD8;   --easy-tint: #E4E9FC;
      --danger: #B93A32;

      --card-rule: rgba(47, 79, 216, 0.07);
      --card-top: #C8453B;

      --radius: 10px;
      --radius-sm: 6px;
      --shadow: 0 1px 2px rgba(23, 35, 59, .06), 0 10px 24px -12px rgba(23, 35, 59, .22);

      --font-ui: "Avenir Next", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, "Noto Sans",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC",
                 "Noto Sans Thai", "Noto Sans Arabic", "Noto Sans Devanagari", sans-serif;
      --font-face: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "Noto Serif", Georgia,
                   "Songti SC", "Noto Serif CJK SC", "Hiragino Mincho ProN", "Noto Serif Thai",
                   "Noto Naskh Arabic", "Noto Serif Devanagari", serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0E1524;
        --surface: #172039;
        --surface-2: #1D2846;
        --ink: #E8EDF8;
        --ink-soft: #A3AFC9;
        --line: #2C3757;

        --accent: #8CA3FF;
        --accent-strong: #AEBFFF;
        --accent-tint: #263159;
        --on-accent: #0E1524;

        --again: #FF8F86;  --again-tint: #3C1F24;
        --hard: #F2BE5C;   --hard-tint: #3A2E14;
        --good: #6FD0A3;   --good-tint: #163A2C;
        --easy: #8CA3FF;   --easy-tint: #263159;
        --danger: #FF8F86;

        --card-rule: rgba(140, 163, 255, 0.08);
        --card-top: #E0685E;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 24px -12px rgba(0, 0, 0, .6);
      }
    }

    /* ------------------------------------------------------------------ base */
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 var(--font-ui);
      min-height: 100vh;
    }
    h1, h2, h3 { margin: 0; line-height: 1.2; font-family: var(--font-face); font-weight: 600; }
    h1 { font-size: clamp(1.7rem, 4vw, 2.25rem); letter-spacing: -0.01em; }
    h2 { font-size: 1.25rem; }
    p { margin: 0; }
    h1:focus, h2:focus { outline: none; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

    .visually-hidden {
      position: absolute !important; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
    }
    .muted { color: var(--ink-soft); }

    /* ------------------------------------------------------------------ chrome */
    .topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: inline-flex; align-items: center; gap: 10px;
      background: none; border: 0; padding: 4px 0; cursor: pointer;
      font: 600 1.35rem/1 var(--font-face); color: var(--ink); letter-spacing: -0.01em;
    }
    .brand-mark {
      width: 20px; height: 24px; position: relative; flex: none;
      border: 2px solid var(--ink); border-radius: 3px;
    }
    .brand-mark::before {                      /* the index-card tab */
      content: ""; position: absolute; top: -6px; left: 3px; width: 8px; height: 5px;
      border: 2px solid var(--ink); border-bottom: 0; border-radius: 3px 3px 0 0; background: var(--surface);
    }
    .brand-mark::after {                       /* the red rule */
      content: ""; position: absolute; left: 0; right: 0; top: 5px; height: 2px; background: var(--card-top);
    }

    .container { width: 100%; max-width: 980px; margin: 0 auto; padding: 28px 20px 96px; }
    .page-head, .deck-header {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap;
      margin-bottom: 20px;
    }

    /* ------------------------------------------------------------------ buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      font: 600 0.95rem/1.2 var(--font-ui);
      padding: 10px 16px; min-height: 40px;
      border-radius: var(--radius-sm); border: 1.5px solid transparent;
      cursor: pointer; text-align: center;
      transition: background-color .12s, border-color .12s, color .12s;
    }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: var(--on-accent); }
    .btn-primary:hover:not(:disabled) { background: var(--accent-strong); }
    .btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
    .btn-secondary:hover:not(:disabled) { border-color: var(--ink-soft); }
    .btn-ghost { background: transparent; color: var(--ink); }
    .btn-ghost:hover:not(:disabled) { background: var(--surface-2); }
    .btn-danger { background: var(--danger); color: #fff; }
    @media (prefers-color-scheme: dark) { .btn-danger { color: #1a0b0d; } }
    .btn-danger-text { color: var(--danger); }
    .btn-small { padding: 6px 10px; min-height: 32px; font-size: 0.85rem; }
    .btn-large { padding: 14px 28px; min-height: 52px; font-size: 1.05rem; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    .link-btn {
      background: none; border: 0; padding: 0; cursor: pointer; text-align: left;
      font: inherit; color: inherit;
    }
    .link-btn:hover { color: var(--accent-strong); text-decoration: underline; text-underline-offset: 3px; }

    /* ------------------------------------------------------------------ forms */
    .input, .select {
      width: 100%; min-height: 42px;
      padding: 9px 12px;
      font: inherit; color: var(--ink);
      background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius-sm);
    }
    .input:hover, .select:hover { border-color: var(--ink-soft); }
    .input:focus-visible, .select:focus-visible { outline: 3px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
    .input[aria-invalid="true"] { border-color: var(--danger); }
    .input-face { font-family: var(--font-face); font-size: 1.15rem; }
    textarea.input { resize: vertical; line-height: 1.45; }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field > label, .label-row > label, legend { font-weight: 600; font-size: 0.9rem; }
    .label-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 22px; }
    .field-hint { font-size: 0.85rem; color: var(--ink-soft); }
    .field-error { font-size: 0.85rem; color: var(--danger); }
    .field-note { font-size: 0.85rem; color: var(--ink-soft); }
    .field-note[data-kind="warn"] { color: var(--hard); }
    .fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
    legend { padding: 0; margin-bottom: 6px; }

    .auto-fill-indicator { display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--ink-soft); }
    .spinner {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid var(--line); border-top-color: var(--accent);
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* language pair: [ Source ▼ ] ⇄ [ Target ▼ ] */
    .lang-pair { display: flex; align-items: flex-end; gap: 10px; }
    .lang-pair-field { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .lang-pair-label { font-size: 0.8rem; font-weight: 600; color: var(--ink-soft); }
    .swap-btn {
      flex: none; width: 42px; height: 42px;
      border: 1.5px solid var(--line); border-radius: 50%;
      background: var(--surface); color: var(--accent-strong);
      font-size: 1.15rem; line-height: 1; cursor: pointer;
    }
    .swap-btn:hover { border-color: var(--accent); background: var(--accent-tint); }

    .lang-bar {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px 16px; margin-bottom: 24px;
      display: flex; flex-direction: column; gap: 8px;
    }

    /* ------------------------------------------------------------------ home */
    .stats-bar {
      display: flex; align-items: center; gap: 28px; flex-wrap: wrap;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 16px 20px; margin-bottom: 20px;
    }
    .stat { display: flex; align-items: baseline; gap: 8px; }
    .stat-value { font: 600 1.9rem/1 var(--font-face); font-variant-numeric: tabular-nums; }
    .stat-label { color: var(--ink-soft); font-size: 0.95rem; }
    .stats-cta { margin-left: auto; }

    .deck-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .deck-row {
      display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 16px 20px;
    }
    .deck-main { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; flex: 1 1 260px; }
    .deck-name { font-size: 1.3rem; overflow-wrap: anywhere; }
    .deck-desc { color: var(--ink-soft); font-size: 0.95rem; overflow-wrap: anywhere; }
    .deck-counts { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.9rem; color: var(--ink-soft); }
    .deck-counts .is-due { color: var(--accent-strong); font-weight: 600; }
    .deck-actions { display: flex; gap: 10px; }
    .pair-badge {
      display: inline-block; font-size: 0.8rem; font-weight: 600;
      padding: 2px 10px; border-radius: 999px;
      background: var(--accent-tint); color: var(--accent-strong);
    }

    .empty-state {
      display: flex; flex-direction: column; align-items: flex-start; gap: 12px;
      background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius);
      padding: 32px clamp(20px, 5vw, 40px);
    }
    .empty-state p { color: var(--ink-soft); max-width: 52ch; }
    .empty-state h2:focus { outline: none; }

    /* ------------------------------------------------------------------ library */
    .deck-header h1 { overflow-wrap: anywhere; }
    .deck-header .deck-desc { margin-top: 4px; }
    .deck-header .deck-counts { margin-top: 8px; }
    .action-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .filter-bar { display: flex; gap: 10px; margin-bottom: 14px; }
    .filter-bar .input { flex: 1 1 auto; }
    .filter-bar .select { flex: 0 0 170px; width: auto; }

    .table-wrap {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      overflow-x: auto;
    }
    .card-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    .card-table th {
      text-align: left; font-size: 0.85rem; font-weight: 600; color: var(--ink-soft);
      padding: 12px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap;
    }
    .card-table td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .card-table tbody tr:last-child td { border-bottom: 0; }
    .cell-front, .cell-back { font-family: var(--font-face); font-size: 1.1rem; overflow-wrap: anywhere; }
    .cell-rom { font-family: var(--font-ui); font-size: 0.95rem; color: var(--ink-soft); overflow-wrap: anywhere; }
    .cell-next { white-space: nowrap; color: var(--ink-soft); }
    .cell-actions { white-space: nowrap; text-align: right; }
    .state-badge { display: inline-block; font-size: 0.78rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; }
    .state-new { background: var(--surface-2); color: var(--ink-soft); border: 1px solid var(--line); }
    .state-learning { background: var(--hard-tint); color: var(--hard); }
    .state-review { background: var(--good-tint); color: var(--good); }
    .state-relearning { background: var(--again-tint); color: var(--again); }

    .pager { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; color: var(--ink-soft); font-size: 0.9rem; }
    .pager-page { font-size: 0.9rem; }

    @media (max-width: 760px) {
      .card-table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .card-table, .card-table tbody, .card-table tr, .card-table td { display: block; width: 100%; }
      .card-table tr { padding: 12px 14px; border-bottom: 1px solid var(--line); }
      .card-table tbody tr:last-child { border-bottom: 0; }
      .card-table td { border: 0; padding: 3px 0; display: flex; gap: 12px; justify-content: space-between; align-items: baseline; }
      .card-table td::before { content: attr(data-label); flex: none; font-size: 0.8rem; color: var(--ink-soft); font-family: var(--font-ui); font-style: normal; }
      .card-table td.cell-actions { justify-content: flex-start; padding-top: 8px; }
      .card-table td.cell-actions::before { content: none; }
      .filter-bar { flex-direction: column; }
      .filter-bar .select { flex-basis: auto; width: 100%; }
    }

    /* ------------------------------------------------------------------ review */
    .review-top { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    .review-progress { flex: 1; display: flex; align-items: center; gap: 14px; font-size: 0.9rem; color: var(--ink-soft); }
    .progress-track { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); transition: width .25s; }
    .practice-note { margin-bottom: 14px; padding: 8px 12px; border-radius: var(--radius-sm); background: var(--hard-tint); color: var(--hard); font-size: 0.9rem; }

    .flashcard {
      position: relative;
      min-height: 340px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      padding: clamp(32px, 7vw, 64px) clamp(20px, 5vw, 56px);
      text-align: center;
      background-color: var(--surface);
      background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 39px, var(--card-rule) 39px, var(--card-rule) 40px);
      background-position: 0 6px;
      border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .flashcard::before {
      content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--card-top);
    }
    .fc-front { font: 600 clamp(2.6rem, 9vw, 4.5rem)/1.15 var(--font-face); overflow-wrap: anywhere; }
    .fc-front-small { font-size: clamp(1.4rem, 4vw, 1.9rem); color: var(--ink-soft); font-weight: 500; }
    .fc-rom { font-family: var(--font-ui); font-size: 1.3rem; font-weight: 500; line-height: 1.35; color: var(--ink-soft); letter-spacing: 0.015em; }
    .fc-divider { width: 64px; border: 0; border-top: 1.5px solid var(--line); margin: 10px 0; }
    .fc-back { font: 600 clamp(2rem, 7vw, 3.2rem)/1.2 var(--font-face); color: var(--accent-strong); overflow-wrap: anywhere; }
    .fc-lang { font-size: 0.9rem; color: var(--ink-soft); }
    .fc-example { margin-top: 14px; max-width: 46ch; font: italic 1.05rem/1.5 var(--font-face); color: var(--ink-soft); }

    .review-controls { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .review-controls > .btn { width: min(100%, 360px); }
    .rating-grid { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .rating-btn {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 12px 6px; min-height: 64px;
      background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius);
      font: inherit; cursor: pointer;
      transition: background-color .12s;
    }
    .rating-label { font-weight: 700; font-size: 1.05rem; }
    .rating-interval { font-size: 0.85rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
    .rating-again { border-color: var(--again); color: var(--again); }
    .rating-again:hover { background: var(--again-tint); }
    .rating-hard { border-color: var(--hard); color: var(--hard); }
    .rating-hard:hover { background: var(--hard-tint); }
    .rating-good { border-color: var(--good); color: var(--good); }
    .rating-good:hover { background: var(--good-tint); }
    .rating-easy { border-color: var(--easy); color: var(--easy); }
    .rating-easy:hover { background: var(--easy-tint); }
    .shortcut-hint { font-size: 0.85rem; color: var(--ink-soft); }
    .review-empty { align-items: center; text-align: center; }

    @media (max-width: 520px) {
      .rating-grid { grid-template-columns: repeat(2, 1fr); }
      .lang-pair { flex-wrap: wrap; }
      .lang-pair-field { flex-basis: 40%; }
    }

    /* ------------------------------------------------------------------ modal + toast */
    dialog {
      width: min(560px, calc(100% - 24px)); max-height: calc(100% - 24px);
      padding: 0; border: 1px solid var(--line); border-radius: 14px;
      background: var(--surface); color: var(--ink);
      box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .5);
      overflow: auto;
    }
    dialog::backdrop { background: rgba(14, 21, 36, .55); }
    .modal-inner { display: flex; flex-direction: column; gap: 18px; padding: 24px; }
    .modal-title { font-size: 1.4rem; }
    .modal-text { color: var(--ink-soft); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
    .modal-actions-start { margin-right: auto; }

    .choice-list { display: flex; flex-direction: column; gap: 10px; }
    .choice {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 12px 14px; border: 1.5px solid var(--line); border-radius: var(--radius); cursor: pointer;
    }
    .choice:hover { border-color: var(--ink-soft); }
    .choice:has(input:checked) { border-color: var(--accent); background: var(--accent-tint); }
    .choice-danger:has(input:checked) { border-color: var(--danger); background: var(--again-tint); }
    .choice input { margin-top: 4px; accent-color: var(--accent); }
    .choice-body { display: flex; flex-direction: column; gap: 2px; }
    .choice-title { font-weight: 700; }
    .choice-text { font-size: 0.9rem; color: var(--ink-soft); }

    #toast {
      position: fixed; inset: auto auto max(24px, env(safe-area-inset-bottom)) 50%; margin: 0;
      transform: translate(-50%, 12px);
      max-width: min(92vw, 520px);
      padding: 12px 18px; border: 0; border-radius: var(--radius-sm);
      background: var(--ink); color: var(--bg);
      font-size: 0.95rem; box-shadow: var(--shadow);
      opacity: 0; pointer-events: none;
      transition: opacity .18s, transform .18s;
      z-index: 1000;
    }
    #toast.is-visible { opacity: 1; transform: translate(-50%, 0); }
    #toast[data-kind="error"] { background: var(--danger); color: #fff; }
    @media (prefers-color-scheme: dark) { #toast[data-kind="error"] { color: #1a0b0d; } }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; }
      .spinner { animation: none; border-top-color: var(--accent); border-right-color: var(--accent); }
    }
  </style>

  <!-- Load order is mandatory. -->
  <script defer src="utils/helpers.js"></script>
  <script defer src="services/storage.js"></script>
  <script defer src="services/deck-portability.js"></script>
  <script defer src="core/scheduler.js"></script>
  <script defer src="ui.js"></script>
  <script defer src="pages/home.js"></script>
  <script defer src="pages/library.js"></script>
  <script defer src="components/deck-manager.js"></script>
  <script defer src="components/card-modal.js"></script>
  <script defer src="components/import-modal.js"></script>
  <script defer src="pages/review.js"></script>
  <script defer src="core/app.js"></script>
</head>
<body>
  <header class="topbar">
    <button type="button" id="brand-home" class="brand" aria-label="Cardfile, go to your decks">
      <span class="brand-mark" aria-hidden="true"></span>
      Cardfile
    </button>
  </header>

  <main class="container">
    <section id="screen-home"><div id="home-content"></div></section>
    <section id="screen-library" hidden><div id="library-content"></div></section>
    <section id="screen-review" hidden><div id="review-content"></div></section>
  </main>

  <dialog id="modal"><div id="modal-body"></div></dialog>
  <div id="toast" popover="manual" role="status" aria-live="polite"></div>
</body>
</html>
